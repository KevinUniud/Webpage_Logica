services:
  webpage-logica:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-12345}:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:5000}
      REVIEW_UPSTREAM: ${REVIEW_UPSTREAM:-http://host.docker.internal:5555}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/web-health"]
      interval: 30s
      timeout: 5s
      retries: 3
